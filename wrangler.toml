# Change "name" to exactly the name of your Worker in the Cloudflare dashboard
# (Workers & Pages > your project). A mismatch makes the build fail.
name = "crystal-collecting-simulator"
main = "worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = true
